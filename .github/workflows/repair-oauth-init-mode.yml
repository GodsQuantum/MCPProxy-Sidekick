name: Repair OAuth init mode
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore executable bit
        run: |
          set -euo pipefail
          git update-index --chmod=+x deploy/oauth-browser/90-sidekick-chromium
          if git diff --cached --quiet; then
            echo "Mode already correct"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore OAuth init executable bit"
          git push
