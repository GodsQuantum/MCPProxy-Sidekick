name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: JavaScript syntax
        run: node --check internal/web/assets/app.js
      - name: Validate visual assets
        run: |
          python3 - <<'PY'
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in (Path("docs/assets/logo.svg"), Path("internal/web/assets/icon.svg")):
              ET.parse(p)
              data=p.read_text(encoding="utf-8")
              assert "<svg" in data and "</svg>" in data, p
          p=Path("docs/assets/dashboard.png")
          raw=p.read_bytes()
          assert raw[:8] == b"\x89PNG\r\n\x1a\n", "invalid PNG signature"
          w,h=struct.unpack(">II", raw[16:24])
          assert w >= 1000 and h >= 800, (w,h)
          print("visual assets OK", w, h)
          PY
      - name: Privacy scan
        run: ./scripts/privacy-scan.sh
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcpproxy-sidekick:ci
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcpproxy-sidekick:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, codeql, container]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcpproxy-sidekick
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
