name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Script syntax
        run: |
          node --check internal/web/assets/app.js
          node --check scripts/ui-smoke.mjs
          node --check scripts/fake-mcpproxy.mjs
          bash -n deploy/oauth-browser/90-sidekick-chromium
      - name: Build Sidekick for browser smoke
        run: go build -o /tmp/mcpproxy-sidekick ./cmd/sidekick
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Browser UI smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          printf 'admin-key\n' >/tmp/sidekick-admin-key
          node scripts/fake-mcpproxy.mjs 18080 >/tmp/fake-mcpproxy.log 2>&1 &
          SIDEKICK_LISTEN_ADDR=127.0.0.1:18081 \
            SIDEKICK_MCPPROXY_URL=http://127.0.0.1:18080 \
            SIDEKICK_MCPPROXY_ADMIN_KEY_FILE=/tmp/sidekick-admin-key \
            SIDEKICK_DB_PATH=/tmp/sidekick-ui.db \
            SIDEKICK_OAUTH_CDP_URL=http://127.0.0.1:65534 \
            SIDEKICK_OAUTH_BROWSER_URL=/oauth-browser/ \
            /tmp/mcpproxy-sidekick >/tmp/sidekick-ui.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:18081/healthz >/dev/null && break; sleep .25; done
          "$CHROME_PATH" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/sidekick-chrome about:blank >/tmp/chrome.log 2>&1 &
          node scripts/ui-smoke.mjs http://127.0.0.1:18081/ 9222 admin-key
      - name: Validate visual assets
        run: |
          python3 - <<'PY'
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in (Path("docs/assets/logo.svg"), Path("internal/web/assets/icon.svg")):
              ET.parse(p)
              data=p.read_text(encoding="utf-8")
              assert "<svg" in data and "</svg>" in data, p
          p=Path("docs/assets/dashboard.png")
          raw=p.read_bytes()
          assert raw[:8] == b"\x89PNG\r\n\x1a\n", "invalid PNG signature"
          w,h=struct.unpack(">II", raw[16:24])
          assert w >= 1000 and h >= 800, (w,h)
          print("visual assets OK", w, h)
          PY
      - name: Privacy scan
        run: ./scripts/privacy-scan.sh
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcpproxy-latest-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest stable MCPProxy
        id: latest
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/smart-mcp-proxy/mcpproxy-go/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Testing MCPProxy $tag"
      - name: Verify Sidekick REST contract against latest stable
        env:
          MCPPROXY_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          chmod 0777 "$work"
          trap 'docker rm -f mcpproxy-contract-test >/dev/null 2>&1 || true; sudo rm -rf "$work"' EXIT
          MCPPROXY_TEST_KEY="$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | sha256sum | cut -c1-32)"
          cat >"$work/mcp_config.json" <<EOF
          {
            "listen": "0.0.0.0:8080",
            "api_key": "$MCPPROXY_TEST_KEY",
            "mcpServers": [],
            "update_check": {"enabled": false, "channel": "stable"}
          }
          EOF
          docker pull "ghcr.io/smart-mcp-proxy/mcpproxy-server:$MCPPROXY_TAG"
          docker run -d --name mcpproxy-contract-test \
            -p 127.0.0.1:19080:8080 \
            -v "$work:/root/.mcpproxy" \
            "ghcr.io/smart-mcp-proxy/mcpproxy-server:$MCPPROXY_TAG"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:19080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19080/healthz >/dev/null
          for endpoint in servers profiles tokens; do
            code="$(curl -sS -o "$work/response" -w '%{http_code}' \
              -H "X-API-Key: $MCPPROXY_TEST_KEY" \
              "http://127.0.0.1:19080/api/v1/$endpoint")"
            test "$code" = "200"
          done

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mcpproxy-sidekick:ci
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcpproxy-sidekick:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, codeql, container]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcpproxy-sidekick
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
